# nfpm configuration for the siphon-probe deb/rpm packages.
# Built per architecture in CI:
#   ARCH=amd64 VERSION=0.1.0 nfpm package -f nfpm.yaml -p deb
#   ARCH=arm64 VERSION=0.1.0 nfpm package -f nfpm.yaml -p rpm
name: siphon-probe
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: serge-r
description: |
  eBPF TC classifier that aggregates IPv4 TCP/UDP traffic by 5-tuple and
  exports the counters to an IPFIX collector over UDP.
homepage: https://github.com/serge-r/siphon
license: MIT

contents:
  - src: ./dist/siphon-probe-linux-${ARCH}
    dst: /opt/siphon-probe/siphon-probe
    file_info:
      mode: 0755
  - src: ./siphon-probe.service
    dst: /lib/systemd/system/siphon-probe.service
  - src: ./siphon-probe.default
    dst: /etc/default/siphon-probe
    type: "config|noreplace"

scripts:
  postinstall: ./scripts/postinstall.sh
  postremove: ./scripts/postremove.sh
