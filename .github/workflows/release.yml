name: Release

# Cut a release by pushing a semver tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Produces, for the tag:
#   - Docker images  serger89/siphon-collector and serger89/siphon-probe
#   - linux amd64/arm64 binaries for both components
#   - deb and rpm packages for the probe
# and attaches the binaries and packages to a GitHub release.
#
# Requires two repository secrets for the Docker Hub push:
#   DOCKERHUB_USERNAME - Docker Hub account (e.g. serger89)
#   DOCKERHUB_TOKEN    - Docker Hub access token with push scope

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Single source of truth for the Go version used by every job.
env:
  GO_VERSION: "1.26"

jobs:
  images:
    name: Build & push ${{ matrix.component }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [collector, probe]
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          file: ${{ matrix.component }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            serger89/siphon-${{ matrix.component }}:${{ steps.version.outputs.version }}
            serger89/siphon-${{ matrix.component }}:latest

  binaries:
    name: Build binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            collector/go.sum
            probe/go.sum
      - name: Install clang and llvm
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm
      - name: Build binaries for both components
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          for arch in amd64 arm64; do
            (cd collector && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "${GITHUB_WORKSPACE}/dist/siphon-collector-linux-${arch}" .)
          done
          make -C probe generate
          make -C probe build-all VERSION="${VERSION}"
          cp probe/siphon-probe-linux-amd64 probe/siphon-probe-linux-arm64 dist/
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*

  packages:
    name: Build probe deb/rpm
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: artifacts
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: Build packages
        run: |
          # deb/rpm versions are numeric by convention: strip the leading "v".
          export VERSION="${GITHUB_REF_NAME#v}"
          cd probe
          mkdir -p dist out
          cp "${GITHUB_WORKSPACE}/artifacts/siphon-probe-linux-amd64" dist/
          cp "${GITHUB_WORKSPACE}/artifacts/siphon-probe-linux-arm64" dist/
          for arch in amd64 arm64; do
            # nfpm does not expand env vars inside contents[].src, so render the
            # config ourselves and feed nfpm a fully-resolved file.
            ARCH="$arch" envsubst '${ARCH} ${VERSION}' < nfpm.yaml > nfpm.rendered.yaml
            for pkg in deb rpm; do
              nfpm package -f nfpm.rendered.yaml -p "$pkg" -t out/
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: probe/out/*

  release:
    name: Publish GitHub release
    needs: [images, binaries, packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: release
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
